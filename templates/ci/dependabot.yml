# Copy to .github/dependabot.yml. Keep only the ecosystems you use.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      js-minor: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
