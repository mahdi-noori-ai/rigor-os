# Edge proxy (nginx-unprivileged listens on 8080 as a non-root user).
upstream api { server api:8000; keepalive 32; }
upstream spa { server frontend:8080; keepalive 16; }

map $http_upgrade $connection_upgrade { default upgrade; '' ''; }

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 20m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Enable once served over HTTPS:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /api/   { proxy_pass http://api; }
    location /admin/ { proxy_pass http://api; }
    location /static/ { proxy_pass http://api; expires 7d; }

    location / { proxy_pass http://spa; }
}
