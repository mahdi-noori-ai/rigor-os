upstream api {
    server api:8000;
}

upstream spa {
    server frontend:8080;
}

server {
    listen 80;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://spa;
        proxy_set_header Host $host;
    }
}
