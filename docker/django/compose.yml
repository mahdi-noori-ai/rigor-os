# Django + Postgres + Redis + Celery (dev-friendly).
# From your project root:
#   cp rigor-os/docker/fullstack/.env.example .env   # then set SECRET_KEY
#   docker compose -f rigor-os/docker/django/compose.yml --env-file .env up --build
#
# Paths below are relative to this file (rigor-os/docker/django/), so ../../.. is
# the project root.

name: ${COMPOSE_PROJECT_NAME:-app}

x-app: &app
  build:
    context: ../../..
    dockerfile: rigor-os/docker/django/Dockerfile
  env_file:
    - path: ../../../.env
      required: false
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
    REDIS_URL: redis://redis:6379/0
    SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    # Postgres 18 images keep data in /var/lib/postgresql/18/docker: mount the parent.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    # Drop-in alternative under a BSD licence: valkey/valkey:9-alpine
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"

  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
