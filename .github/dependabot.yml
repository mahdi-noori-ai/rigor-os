version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/templates/ci"]
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: ["/docker/django", "/docker/react"]
    schedule: { interval: weekly }
  - package-ecosystem: docker-compose
    directories: ["/docker/fullstack", "/docker/django", "/docker/shahrah"]
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: /shahrah
    schedule: { interval: weekly }
    groups:
      cargo-minor: { update-types: [minor, patch] }
  - package-ecosystem: docker
    directory: /shahrah
    schedule: { interval: weekly }
