# Tooling config for Rigor OS's own scripts and tests (the tools themselves are stdlib-only).
[project]
name = "rigor-os"
version = "1.1.0"
description = "Engineering operating system for AI coding agents"
requires-python = ">=3.10"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
